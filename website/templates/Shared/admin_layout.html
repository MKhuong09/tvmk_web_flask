<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Dân quân - Admin</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='Web/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Web/css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 240px; background-color: #ffffff; border-right: 1px solid #e3e6f0; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; transition: all 0.3s ease-in-out; }
        .sidebar-header { padding: 25px 20px; text-align: center; font-size: 0.9rem; color: #858796; border-bottom: 1px solid #f8f9fc; white-space: nowrap; overflow: hidden; }
        .sidebar-header strong { display: block; color: #4e73df; font-size: 1.1rem; margin-bottom: 3px; }
        .sidebar-menu { list-style: none; padding: 10px 0; }
        
        .sidebar-item a { display: flex; align-items: center; padding: 14px 24px; color: #5a5c69; text-decoration: none; font-size: 0.95rem; transition: all 0.2s ease; white-space: nowrap; border-left: 4px solid transparent; }
        .sidebar-item a i { margin-right: 14px; font-size: 1.25rem; color: #b7b9cc; transition: all 0.2s ease; }
        .sidebar-item a:hover { background-color: #f8fafc; color: #4e73df; font-weight: 500; border-left: 4px solid #4e73df; }
        .sidebar-item.active a { background-color: #f1f5f9; color: #4e73df; font-weight: 600; border-left: 4px solid #4e73df; }

        /* MAIN APPS */
        .main-wrapper { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-width: 0; transition: all 0.3s ease-in-out; }
        .top-header { height: 60px; background-color: #0a46e4; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; color: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header-left-toggle { background: #e53e3e; border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; user-select: none; transition: none; } /* Đã xóa transition transform */
        
        .header-right-info { display: flex; align-items: center; gap: 15px; }
        .role-badge { background-color: #2ecc71; color: white; padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        .logout-btn { background-color: #1a202c; color: white; padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; text-decoration: none; }
        
        .content-body { padding: 30px; flex: 1; }

        /* LOGIC THU GỌN SIDEBAR */
        body.sidebar-collapsed .sidebar { width: 70px; }
        body.sidebar-collapsed .sidebar-header span, body.sidebar-collapsed .sidebar-header strong, body.sidebar-collapsed .sidebar-item a span { display: none; }
        body.sidebar-collapsed .sidebar-item a { justify-content: center; padding: 15px 0; border-left: 4px solid transparent; }
        body.sidebar-collapsed .main-wrapper { margin-left: 70px; }
        /* Đã xóa rotate(180deg) ở đây */
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <strong>{{ current_user.user_name }}</strong>
            <span>Quản trị viên</span>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-item {{ 'active' if 'home' in request.path }}">
                <a href="{{ url_for('admin_views.admin_home') }}">
                    <i class="mdi mdi-chart-bar"></i> <span>Thống kê</span>
                </a>
            </li>          
            <li class="sidebar-item {{ 'active' if 'scheduleList' in request.path }}">
                <a href="{{ url_for('admin_views.admin_scheduleList') }}">
                    <i class="mdi mdi-account-group-outline"></i> <span>Dân quân</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="main-wrapper">
        <div class="top-header">
            <button class="header-left-toggle" id="toggle-sidebar-btn">
                <i class="mdi mdi-chevron-double-left" id="toggle-icon"></i>
            </button>
            <div class="header-right-info">
                <span class="role-badge">Quản trị viên</span>
                <a href="{{ url_for('auth.logout') }}" class="logout-btn">Đăng xuất</a>
            </div>
        </div>
        <div class="content-body">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const toggleBtn = document.getElementById("toggle-sidebar-btn");
            const icon = document.getElementById("toggle-icon");
            const body = document.body;

            // Khôi phục trạng thái từ bộ nhớ
            if (localStorage.getItem("sidebar-collapsed") === "true") {
                body.classList.add("sidebar-collapsed");
                icon.className = "mdi mdi-chevron-double-right";
            }

            if (toggleBtn) {
                toggleBtn.addEventListener("click", function() {
                    body.classList.toggle("sidebar-collapsed");
                    
                    // Cập nhật biểu tượng không xoay
                    if (body.classList.contains("sidebar-collapsed")) {
                        icon.className = "mdi mdi-chevron-double-right";
                    } else {
                        icon.className = "mdi mdi-chevron-double-left";
                    }
                    
                    localStorage.setItem("sidebar-collapsed", body.classList.contains("sidebar-collapsed"));
                });
            }
        });
    </script>
</body>
</html>
