{% extends "Shared/client_layout.html" %}

{% block content %}
<!-- Stylesheet tùy biến canh chỉnh và animation cho Form Thông tin cá nhân -->
<style>
  @keyframes slideInUp {
    0% {
      opacity: 0;
      transform: translateY(20px) scale(0.99);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .profile-container {
    max-width: 600px;
    margin: 35px auto 55px auto;
    animation: slideInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .profile-box {
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #e7eee0;
    box-shadow: 0 12px 36px -8px rgba(35, 45, 10, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
    overflow: hidden;
    transition: box-shadow 0.3s ease;
  }

  .profile-box:hover {
    box-shadow: 0 16px 42px -8px rgba(35, 45, 10, 0.12);
  }

  .profile-header-banner {
    background: linear-gradient(135deg, #f8faf4 0%, #f0f6e6 100%);
    padding: 24px 28px;
    border-bottom: 2px solid #A5C422;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .profile-icon-badge {
    width: 44px;
    height: 44px;
    background: #A5C422;
    color: #ffffff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(165, 196, 34, 0.35);
    flex-shrink: 0;
  }

  .profile-heading {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: #242c18;
  }

  .profile-subheading {
    margin: 3px 0 0;
    font-size: 13px;
    color: #647055;
  }

  .profile-form {
    padding: 28px;
  }

  .form-group-item {
    margin-bottom: 22px;
    position: relative;
  }

  .form-group-item label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: 13.5px;
    color: #414a38;
    margin-bottom: 8px;
  }

  .label-badge {
    font-size: 11px;
    font-weight: 500;
    color: #78846c;
    background: #f1f5eb;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper .input-leading-icon {
    position: absolute;
    left: 14px;
    color: #8c9980;
    font-size: 14px;
    pointer-events: none;
    transition: color 0.2s ease, transform 0.2s ease;
  }

  .input-field {
    width: 100%;
    padding: 12px 16px 12px 42px;
    font-size: 14px;
    font-family: inherit;
    color: #1e2516;
    background-color: #ffffff;
    border: 1.5px solid #dce5d2;
    border-radius: 10px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-sizing: border-box;
    outline: none;
  }

  .input-field:focus {
    border-color: #A5C422;
    background-color: #ffffff;
    box-shadow: 0 0 0 4px rgba(165, 196, 34, 0.18);
  }

  .input-field:focus + .input-leading-icon {
    color: #7b9415;
    transform: scale(1.1);
  }

  .input-field:disabled {
    background-color: #f7f9f4;
    color: #6f7868;
    border-color: #e5ece0;
    cursor: not-allowed;
  }

  .btn-submit-action {
    background: linear-gradient(135deg, #A5C422 0%, #8ea918 100%);
    color: #ffffff;
    border: none;
    padding: 12px 28px;
    font-size: 14.5px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    box-shadow: 0 4px 14px rgba(165, 196, 34, 0.35);
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-submit-action:hover {
    background: linear-gradient(135deg, #adc72b 0%, #809915 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(165, 196, 34, 0.45);
  }

  .btn-submit-action:active {
    transform: translateY(0);
  }

  .btn-submit-action::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
  }

  .btn-submit-action:hover::after {
    left: 100%;
  }
</style>

<div class="container profile-container">
    <div class="profile-box">
        <div class="profile-header-banner">
            <div class="profile-icon-badge">
                <i class="fa fa-user"></i>
            </div>
            <div>
                <h2 class="profile-heading">Thông tin cá nhân</h2>
                <p class="profile-subheading">Quản lý và cập nhật hồ sơ tài khoản của bạn</p>
            </div>
        </div>

        <!-- Form -->
        <form method="POST" class="profile-form">
            <!-- Email đăng nhập  -->
            <div class="form-group-item">
                <label>
                    <span><i class="fa fa-envelope" style="color: #A5C422; margin-right: 4px;"></i> Email đăng nhập</span>
                    <span class="label-badge"><i class="fa fa-lock"></i> Không thể đổi</span>
                </label>
                <div class="input-wrapper">
                    <input type="email" class="input-field" value="{{ user.email }}" disabled>
                    <i class="fa fa-at input-leading-icon"></i>
                </div>
            </div>

            <!-- Họ và tên -->
            <div class="form-group-item">
                <label>
                    <span><i class="fa fa-id-card" style="color: #A5C422; margin-right: 4px;"></i> Họ và tên</span>
                    <span style="color: #e11d48; font-size: 12px; font-weight: normal;">* Bắt buộc</span>
                </label>
                <div class="input-wrapper">
                    <input type="text" name="full_name" class="input-field" value="{{ user.full_name or '' }}" placeholder="Nhập họ và tên đầy đủ của bạn..." required>
                    <i class="fa fa-user-pen input-leading-icon"></i>
                </div>
            </div>

            <!-- Số ngày nghỉ  -->
            <div class="form-group-item">
                <label>
                    <span><i class="fa fa-calendar-check" style="color: #A5C422; margin-right: 4px;"></i> Số ngày được phép nghỉ trong tuần</span>
                    <span class="label-badge"><i class="fa fa-shield-halved"></i> Quy định</span>
                </label>
                <div class="input-wrapper">
                    <input type="text" class="input-field" value="{{ user.allowed_off_days }} ngày / tuần" disabled>
                    <i class="fa fa-clock input-leading-icon"></i>
                </div>
            </div>

            <!-- Nút Lưu thay đổi -->
            <div style="margin-top: 28px;">
                <button type="submit" class="btn-submit-action">
                    <i class="fa fa-save"></i> Lưu thay đổi
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
