<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu điều chỉnh lịch trực</title>
    <!-- Sử dụng Bootstrap 5 cho giao diện hiện đại -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 650px;">
        <div class="card shadow-sm border-0">
            <!-- Header của Phiếu -->
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0"><i class="fas fa-file-alt me-2"></i>PHIẾU YÊU CẦU ĐIỀU CHỈNH LỊCH TRỰC</h4>
                <small class="text-light">Hệ thống quản lý dân quân Ấp 27</small>
            </div>

            <!-- Nội dung Form -->
            <div class="card-body p-4">
                <form action="{{ url_for('client_request.submit_shift_adjustment', id=reg.id) }}" method="POST">
                    
                    <!-- Thông tin người gửi (Readonly) -->
                    <div class="mb-3 row">
                        <label class="col-sm-4 col-form-label fw-bold">Họ và tên:</label>
                        <div class="col-sm-8">
                            <input type="text" readonly class="form-control-plaintext" value="{{ current_user.user_name }}">
                        </div>
                    </div>

                    <!-- Thông tin lịch hiện tại cần đổi -->
                    <div class="mb-3 row">
                        <label class="col-sm-4 col-form-label fw-bold">Lịch trực hiện tại:</label>
                        <div class="col-sm-8">
                            <input type="text" readonly class="form-control-plaintext text-secondary" value="Tuần {{ reg.week_number }} - Buổi: {{ reg.session }} (Thứ: {{ ', '.join(reg.working_days) }})">
                        </div>
                    </div>

                    <hr>

                    <!-- Phần điều chỉnh (Adjust session) -->
                    <div class="mb-3">
                        <label for="new_session" class="form-label fw-bold">Đăng ký đổi thành buổi/ca mới:</label>
                        <select class="form-select" id="new_session" name="new_session" required>
                            <option value="" selected disabled>-- Chọn buổi trực thay thế --</option>
                            <option value="Buổi sáng">Buổi sáng</option>
                            <option value="Buổi chiều">Buổi chiều</option>
                            <option value="Buổi tối">Buổi tối</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="reason" class="form-label fw-bold">Lý do xin điều chỉnh:</label>
                        <textarea class="form-control" id="reason" name="reason" rows="4" placeholder="Nhập chi tiết lý do muốn thay đổi lịch (Ví dụ: Bận công việc gia đình, đi học đột xuất...)" required></textarea>
                    </div>

                    <!-- Các nút thao tác -->
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('client_views.client_detailshift') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-1"></i> Gửi phiếu yêu cầu
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
